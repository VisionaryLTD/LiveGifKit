name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/**

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Swift package tests
        run: swift test

      - name: Build macOS demo
        run: |
          xcodebuild \
            -project Demo/GifDemo.xcodeproj \
            -scheme GifDemo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
